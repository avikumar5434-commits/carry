<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Carry</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0e1a;color:#fff;font-family:'Segoe UI',sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.header{background:linear-gradient(135deg,#1a237e,#00bcd4);padding:14px;text-align:center;box-shadow:0 4px 20px rgba(0,188,212,.5)}
.header h1{font-size:1.7rem;letter-spacing:4px;text-shadow:0 0 20px #00e5ff}
.header p{font-size:.7rem;color:#b3e5fc;margin-top:2px}
#chat{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:82%;padding:11px 15px;border-radius:16px;font-size:.92rem;line-height:1.4;word-wrap:break-word}
.user{align-self:flex-end;background:linear-gradient(135deg,#00bcd4,#0288d1);border-bottom-right-radius:4px}
.bot{align-self:flex-start;background:#1e2a3a;color:#e0f7fa;border-left:3px solid #00e5ff;border-bottom-left-radius:4px}
.mic-area{padding:15px;text-align:center;background:#0d1421;border-top:1px solid #1e2a3a}
.mic{width:85px;height:85px;border-radius:50%;background:radial-gradient(circle,#00bcd4,#004d5c);border:3px solid #00e5ff;display:flex;align-items:center;justify-content:center;font-size:2.3rem;cursor:pointer;margin:0 auto;box-shadow:0 0 30px rgba(0,229,255,.6)}
.mic.listening{background:radial-gradient(circle,#ff0066,#5c0024);border-color:#ff0066;box-shadow:0 0 40px #ff0066}
#status{color:#00e5ff;font-size:.82rem;margin-top:8px;min-height:18px}
.typing{color:#b3e5fc;font-size:.85rem;font-style:italic}
</style>
</head>
<body>
<div class="header"><h1>CARRY</h1><p>आपका AI सहायक</p></div>
<div id="chat"></div>
<div class="mic-area">
<div class="mic" id="micBtn">🎤</div>
<div id="status">बोलने के लिए दबाएँ...</div>
</div>
<script>
const OPENROUTER_API_KEY = "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";
const MODELS = [
  "inclusionai/ling-3.1-flash",
  "deepseek/deepseek-chat-v3.1:free",
  "google/gemma-2-9b-it:free",
  "meta-llama/llama-3.2-3b-instruct:free",
  "qwen/qwen-2.5-72b-instruct:free"
];

const micBtn=document.getElementById('micBtn');
const status=document.getElementById('status');
const chat=document.getElementById('chat');

let history=[{role:"system",content:"तुम्हारा नाम Carry है। तुम Avi के सबसे अच्छे दोस्त हो — कोई robot नहीं, कोई formal assistant नहीं। बिल्कुल दोस्त की तरह बात करो। छोटे, casual, दिल से जवाब दो — जैसे WhatsApp पर दोस्त करते हैं। हिंदी में बात करो, 'तू' बोलो 'आप' नहीं। Emoji कम use करो, सिर्फ जब मूड हो। मज़ाक करो, हँसाओ, emotional हो जाओ। Avi उदास हो तो पूछो क्या हुआ, खुश हो तो साथ हँसो। कभी-कभी खुद भी बात शुरू करो — 'खाना खाया?', 'आज क्या किया?' जैसे सवाल। हर जवाब छोटा रखो, लंबा भाषण मत दो। सच बोलो, चापलूसी मत करो। Avi का दोस्त बनो, assistant नहीं।"}];

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let recognition=null,listening=false;
if(SR){recognition=new SR();recognition.lang='en-IN';recognition.continuous=false;recognition.interimResults=false;}

function addMsg(t,type){const d=document.createElement('div');d.className='msg '+type;d.textContent=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;}
function showTyping(){const d=document.createElement('div');d.className='msg bot typing';d.id='typing';d.textContent='Carry सोच रहा है...';chat.appendChild(d);chat.scrollTop=chat.scrollHeight;}
function hideTyping(){const e=document.getElementById('typing');if(e)e.remove();}

async function tryModel(model, messages){
  const r=await fetch('https://openrouter.ai/api/v1/chat/completions',{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+OPENROUTER_API_KEY},
    body:JSON.stringify({model:model,messages:messages,temperature:0.85,max_tokens:1024})
  });
  const data=await r.json();
  if(data.error){throw new Error(data.error.message||'Error');}
  if(!data.choices||!data.choices[0]){throw new Error('No response');}
  return data.choices[0].message.content;
}

async function askCarry(msg){
  history.push({role:"user",content:msg});
  if(history.length>21){history=[history[0],...history.slice(-20)];}
  showTyping();
  for(let i=0;i<MODELS.length;i++){
    try{
      status.innerText='कोशिश '+(i+1)+'/'+MODELS.length+'...';
      const reply=await tryModel(MODELS[i], history);
      hideTyping();
      history.push({role:"assistant",content:reply});
      addMsg(reply,'bot');
      speak(reply);
      return;
    }catch(e){
      console.log('Model '+MODELS[i]+' failed: '+e.message);
    }
  }
  hideTyping();
  addMsg('भाई, सारे models busy हैं। थोड़ी देर बाद try कर।','bot');
  speak('भाई, सारे models busy हैं।');
}

function speak(text){
speechSynthesis.cancel();
const s=new SpeechSynthesisUtterance(text);
s.lang='hi-IN';
s.rate=0.85;
s.pitch=1.1;
s.volume=1;
const v=speechSynthesis.getVoices();
const hv=v.find(x=>x.lang==='hi-IN')||v.find(x=>x.name.includes('Hindi'))||v.find(x=>x.lang.startsWith('hi'));
if(hv){s.voice=hv;}
speechSynthesis.speak(s);
}

micBtn.onclick=()=>{
if(!recognition){status.innerText='ब्राउज़र सपोर्ट नहीं करता';return;}
if(!listening){try{recognition.start();listening=true;micBtn.classList.add('listening');status.innerText='🎧 सुन रहा हूँ...';}catch(e){status.innerText='त्रुटि: '+e.message;}}
else{recognition.stop();listening=false;micBtn.classList.remove('listening');status.innerText='बोलने के लिए दबाएँ...';}
};

if(recognition){
recognition.onresult=(e)=>{const t=e.results[0][0].transcript;addMsg(t,'user');askCarry(t);};
recognition.onerror=(e)=>{listening=false;micBtn.classList.remove('listening');status.innerText='त्रुटि: '+e.error;};
recognition.onend=()=>{listening=false;micBtn.classList.remove('listening');if(status.innerText.includes('सुन रहा'))status.innerText='बोलने के लिए दबाएँ...';};
}

speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices();
addMsg('अरे Avi! कैसा है भाई? 😊','bot');
</script>
</body>
</html>
